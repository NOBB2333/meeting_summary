[package]
name = "opencap-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
links = "opencap_native"
[dependencies]
anyhow.workspace = true
opencap-core.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["randr", "xfixes", "shape"] }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
font-kit = { package = "zed-font-kit", version = "=0.14.1-zed" }
pathfinder_geometry = "0.5"
[target.'cfg(target_os = "macos")'.dependencies]
serde_json.workspace = true
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
wasapi = "=0.25.0"
windows = { version = "0.62.2", features = ["Graphics_Capture", "Security_Authorization_AppCapabilityAccess", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Performance", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_RemoteDesktop"] }
