name: Linux (UOS compatible)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-glibc228
          cache-on-failure: true
          cache-all-crates: true
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build pinned FFmpeg and glibc 2.28 toolchain
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: scripts/linux/Dockerfile
          load: true
          tags: opencap-build:glibc228
          cache-from: type=gha,scope=opencap-linux-toolchain
          cache-to: type=gha,mode=max,scope=opencap-linux-toolchain,ignore-error=true
      - name: Formatting, tests and Clippy
        run: |
          docker run --rm -v "$PWD:/workspace" -v "$HOME/.cargo/registry:/opt/rust/cargo/registry" opencap-build:glibc228 bash -euc '
            cargo fmt --all -- --check
            scripts/setup.sh
            scripts/dev.sh test
            scripts/dev.sh lint -- -D warnings
          '
      - name: Release build
        id: release
        run: |
          docker run --rm -v "$PWD:/workspace" -v "$HOME/.cargo/registry:/opt/rust/cargo/registry" opencap-build:glibc228 scripts/dev.sh build --release
      - name: Bundle dependencies and audit ELF compatibility
        id: package
        run: docker run --rm -v "$PWD:/workspace" opencap-build:glibc228 scripts/package.sh
      - name: Native X11, audio and GUI checks
        run: docker run --rm -v "$PWD:/workspace" opencap-build:glibc228 dbus-run-session -- python3 scripts/linux/smoke.py target/release
      - name: Packaged application without developer library paths
        run: |
          docker run --rm -v "$PWD:/workspace" opencap-build:glibc228 bash -euc '
            export LD_LIBRARY_PATH="$PWD/release/OpenCap-linux-x64/usr/lib"
            export PATH="$PWD/release/OpenCap-linux-x64/usr/bin:/usr/bin:/bin"
            export FONTCONFIG_FILE="$PWD/release/OpenCap-linux-x64/fonts.conf"
            unset LIBRARY_PATH PKG_CONFIG_PATH
            dbus-run-session -- python3 scripts/linux/smoke.py release/OpenCap-linux-x64/usr/bin
          '
      - name: Restore workspace cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target "$HOME/.cargo/registry" release 2>/dev/null || true
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: OpenCap-linux-x64
          path: |
            release/OpenCap-linux-x64.tar.gz
            release/OpenCap-linux-x64.deb
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        if: failure() && steps.package.outcome == 'success'
        with:
          name: Linux-diagnostic-build
          path: release/OpenCap-linux-x64.tar.gz
          retention-days: 3
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Linux-validation
          path: |
            target/verify/linux-smoke/report.json
            target/verify/linux-smoke/*/stats.json
            target/verify/linux-smoke/gui.log
            target/verify/linux-smoke/gui.png
            release/OpenCap-linux-x64/elf-audit.json
          if-no-files-found: ignore
