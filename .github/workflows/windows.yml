name: Windows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned FFmpeg development libraries
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Build
        shell: pwsh
        run: ./scripts/dev.ps1 build
      - name: Release build with compiled GPUI shaders
        shell: pwsh
        run: ./scripts/dev.ps1 build -Release
      - name: Verify executable-local runtime dependencies without developer PATH
        shell: pwsh
        run: |
          ./scripts/test-runtime.ps1 -Directory target/debug -CliOnly
          ./scripts/test-runtime.ps1 -Directory target/release -CliOnly
      - name: Unit and software-codec integration tests
        shell: pwsh
        run: ./scripts/dev.ps1 test
      - name: Lint
        shell: pwsh
        run: ./scripts/dev.ps1 lint -- -D warnings
      - name: Package and verify portable runtime
        shell: pwsh
        run: ./scripts/package.ps1 -Release -LocalPreview
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCap-windows-x64
          path: release/OpenCap-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
