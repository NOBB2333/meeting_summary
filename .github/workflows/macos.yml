name: macOS
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check release version
        run: python3 scripts/release.py check-version --tag "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Save native files before rust-cache's post-job target cleanup.
      - uses: actions/cache@v5
        id: sherpa-cache
        with:
          path: target/sherpa-onnx-prebuilt
          key: sherpa-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Recover an uncached native SDK
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          cargo clean -p sherpa-onnx-sys
      - name: Native prerequisites
        run: |
          brew install ffmpeg pkgconf
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          scripts/setup.sh
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Unit and software-codec integration tests
        run: scripts/dev.sh test
      - name: Lint
        run: scripts/dev.sh lint -- -D warnings
      - name: Release build and dependency bundle
        run: |
          scripts/dev.sh build --release
          scripts/package.sh
          codesign --verify --deep --strict release/OpenCap.app
          iconutil -c iconset release/OpenCap.app/Contents/Resources/OpenCap.icns -o /tmp/OpenCap.iconset
          ditto -c -k --sequesterRsrc --keepParent release/OpenCap.app release/OpenCap-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: OpenCap-macos-${{ matrix.arch }}
          path: release/OpenCap-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
