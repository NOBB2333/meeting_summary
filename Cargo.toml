[workspace]
members = ["crates/core", "crates/policy", "crates/platform", "crates/media", "crates/app", "crates/bench", "crates/asr"]
default-members = ["crates/app", "crates/bench"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
parking_lot = "0.12"
clap = { version = "4.5", features = ["derive"] }
opencap-core = { path = "crates/core" }
opencap-policy = { path = "crates/policy" }
opencap-platform = { path = "crates/platform" }
opencap-media = { path = "crates/media" }
opencap-asr = { path = "crates/asr" }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
